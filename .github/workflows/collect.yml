name: 행정동코드 수집

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write # 데이터 갱신 브랜치 푸시
  pull-requests: write # 갱신 PR 만들기
  issues: write # 실패 이슈 남기기
  actions: write # 예약 워크플로 유지(아래 keepalive)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6

      # 검증 오류가 있으면 파이프라인이 종료 코드 1로 멈추고 data/v1을 쓰지 않는다 → 아래 실패 이슈로 이어진다
      - name: 원천 수집과 data/v1 생성
        run: ./gradlew :pipeline:run --args="build --from-mois" 2>&1 | tee pipeline.log

      # meta.tsv에는 데이터 파일 4개의 해시가 들어 있으므로, meta.tsv가 그대로면 데이터도 그대로다
      - name: 데이터가 바뀌었으면 PR 만들기
        run: |
          if git diff --quiet -- data/v1/meta.tsv; then
            echo "데이터 변경 없음"
            exit 0
          fi
          data_date=$(awk -F'\t' '$1=="data_date"{print $2}' data/v1/meta.tsv)
          version=$(awk -F'\t' '$1=="version"{print substr($2,1,12)}' data/v1/meta.tsv)
          branch="data/${data_date}-${version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "이미 같은 데이터의 PR 브랜치가 있습니다: $branch"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/
          git commit -m "data: 행정동코드 갱신 (기준일 ${data_date})"
          git push origin "$branch"

          {
            echo "행안부 원천이 바뀌어 \`data/v1\`을 다시 만들었습니다."
            echo
            echo "## 원천"
            echo '```'
            cat data/v1/source.tsv
            echo '```'
            echo
            echo "## 파이프라인 로그 (경고·요약)"
            echo '```'
            grep -E '경고|WARNING|정보|INFO' pipeline.log | grep -v -E '^\s*at ' || true
            echo '```'
            echo
            echo "## 확인할 것"
            echo "- [ ] \`data/v1/unresolved-succession.tsv\`에 새로 생긴 미해결 변환이 있으면 게시글 첨부 변경내역을 보고 \`overrides/successions.tsv\`에 채우기"
            echo "- [ ] 행 수·변환 수가 게시글 내용과 맞는지"
          } > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "data: 행정동코드 갱신 (기준일 ${data_date})" --body-file pr-body.md

      - name: 실패하면 이슈 남기기
        if: failure()
        run: |
          title="행정동코드 수집 실패"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "다시 실패했습니다: ${run_url}"
          else
            gh issue create --title "$title" --body "수집 워크플로가 실패했습니다. 로그를 확인하세요: ${run_url}"
          fi

      # 공개 레포의 예약 워크플로는 60일간 레포 활동이 없으면 자동으로 꺼진다(이전 수집기 kr-juso가 이렇게 멈춤).
      # 매번 API로 다시 켜서 그 기간을 초기화한다.
      - name: 예약 워크플로 유지
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
